[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpv-audio-pairing"
version = "0.4.0"
description = "Audio fingerprint matching and aligned exports for FPV and StickCam recordings"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.scripts]
fpv-audio-pairing = "fpv_audio_pairing.web:main"

[tool.setuptools.package-data]
fpv_audio_pairing = ["static/*", "static/brand/*"]

[tool.setuptools.packages.find]
include = ["fpv_audio_pairing*"]
